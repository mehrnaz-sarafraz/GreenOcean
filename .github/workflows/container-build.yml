name: Container Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          tags: greenocean/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            EXPO_PUBLIC_API_URL=https://api.example.invalid
