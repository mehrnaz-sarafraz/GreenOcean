name: GreenOcean quality gates
on:
  pull_request:
  push:
    branches: [main, feature/phase-a-identity-privacy-access, feature/phase-b-welcome-trust-experience, feature/phase-c-registration-completion, feature/phase-d-email-verification-activation, feature/phase-ef-account-access-security]
concurrency:
  group: quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: greenocean_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-qa-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d greenocean_qa"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      GREENOCEAN_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/greenocean_qa
      GREENOCEAN_TEST_DB_PASSWORD: synthetic-qa-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B clean verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform all
      - name: Select browser runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-platform-bundles
          path: frontend/dist
  registration-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: greenocean_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-qa-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d greenocean_qa"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      GREENOCEAN_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/greenocean_qa
      GREENOCEAN_TEST_DB_PASSWORD: synthetic-qa-only
      GREENOCEAN_LIVE_BROWSER_QA: isolated-only
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Compile isolated live test server
        run: chmod +x mvnw && ./mvnw -B test-compile dependency:build-classpath -Dmdep.outputFile=target/live-classpath
        working-directory: backend
      - name: Start isolated backend and synthetic email transport
        working-directory: backend
        run: |
          java -cp "target/test-classes:target/classes:$(cat target/live-classpath)" com.greenocean.backend.PhaseCLiveServer > target/live-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/v1/health >/dev/null && test -f target/qa-mailbox-token; then exit 0; fi
            sleep 1
          done
          tail -100 target/live-server.log
          exit 1
      - name: Prepare test-only HTTPS WebAuthn origin
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout backend/target/qa-tls.key -out backend/target/qa-tls.crt -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
      - name: Real browser registration against PostgreSQL and test mail delivery
        working-directory: frontend
        run: npx playwright test --config playwright.live.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-live-evidence
          path: |
            frontend/playwright-live-report
            frontend/test-results
            backend/target/live-server.log
