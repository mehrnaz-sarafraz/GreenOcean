name: GreenOcean quality gates
on:
  pull_request:
  push:
    branches: [main, feature/phase-a-identity-privacy-access, feature/phase-b-welcome-trust-experience]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: greenocean_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-qa-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d greenocean_qa"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      GREENOCEAN_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/greenocean_qa
      GREENOCEAN_TEST_DB_PASSWORD: synthetic-qa-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B clean verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-web
          path: frontend/dist
