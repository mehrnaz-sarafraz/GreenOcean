name: GreenOcean quality gates
on:
  pull_request:
  push:
    branches: [codex/phase-m1-group-privacy-approval, codex/phase-m2-membership-governance, codex/phase-m3-activities-safety, codex/phase-l1-safe-publishing, codex/phase-l2-social-interactions, codex/phase-l3-community-safety, main, feature/phase-a-identity-privacy-access, feature/phase-b-welcome-trust-experience, feature/phase-c-registration-completion, feature/phase-d-email-verification-activation, feature/phase-ef-account-access-security, feature/phase-gh-profile-privacy-onboarding, feature/phase-i-first-real-support, feature/phase-j-legal-consent-data-governance, feature/phase-k-final-integration-readiness]
concurrency:
  group: quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: greenocean_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-qa-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d greenocean_qa"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      GREENOCEAN_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/greenocean_qa
      GREENOCEAN_TEST_DB_PASSWORD: synthetic-qa-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B clean verify
        working-directory: backend
      - name: Restore disposable synthetic backup with PostgreSQL18 tools
        env:
          QA_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$QA_POSTGRES_CONTAINER" pg_dump -U postgres -Fc greenocean_qa > backend/target/synthetic-backup.dump
          docker exec "$QA_POSTGRES_CONTAINER" createdb -U postgres greenocean_restore_qa
          docker exec -i "$QA_POSTGRES_CONTAINER" pg_restore -U postgres --exit-on-error -d greenocean_restore_qa < backend/target/synthetic-backup.dump
          docker exec -i "$QA_POSTGRES_CONTAINER" psql -U postgres -d greenocean_qa -At -v ON_ERROR_STOP=1 < scripts/phase_k_restore_verify.sql > backend/target/phase-k-original-checksums.txt
          docker exec -i "$QA_POSTGRES_CONTAINER" psql -U postgres -d greenocean_restore_qa -At -v ON_ERROR_STOP=1 < scripts/phase_k_restore_verify.sql > backend/target/phase-k-restored-checksums.txt
          cmp backend/target/phase-k-original-checksums.txt backend/target/phase-k-restored-checksums.txt
          echo 'Isolated synthetic backup restored with identical selected-table and Flyway checksums; production restore/deletion replay remains unverified.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: |
            backend/target/surefire-reports
            backend/target/phase-k-*-checksums.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform all
      - name: Select browser runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-platform-bundles
          path: frontend/dist
  registration-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: greenocean_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-qa-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d greenocean_qa"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      GREENOCEAN_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/greenocean_qa
      GREENOCEAN_TEST_DB_PASSWORD: synthetic-qa-only
      GREENOCEAN_LIVE_BROWSER_QA: isolated-only
      GREENOCEAN_LIVE_SUPPORT_QA: isolated-only
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Compile isolated live test server
        run: chmod +x mvnw && ./mvnw -B test-compile dependency:build-classpath -Dmdep.outputFile=target/live-classpath
        working-directory: backend
      - name: Start isolated backend and synthetic email transport
        working-directory: backend
        run: |
          java -cp "target/test-classes:target/classes:$(cat target/live-classpath)" com.greenocean.backend.PhaseCLiveServer > target/live-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/v1/health >/dev/null && test -f target/qa-mailbox-token; then exit 0; fi
            sleep 1
          done
          tail -100 target/live-server.log
          exit 1
      - name: Prepare test-only HTTPS WebAuthn origin
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout backend/target/qa-tls.key -out backend/target/qa-tls.crt -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
      - name: Real browser registration against PostgreSQL and test mail delivery
        working-directory: frontend
        run: npx playwright test --config playwright.live.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-live-evidence
          path: |
            frontend/playwright-live-report
            frontend/test-results
            backend/target/live-server.log
  release-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Current source secret patterns and original migration checksums
        run: python3 scripts/phase_k_source_checks.py
      - name: Resolve actual runtime Maven dependency graph
        run: chmod +x mvnw && ./mvnw -B dependency:tree -DoutputType=json -DoutputFile=target/phase-k-dependencies.json -Dscope=runtime
        working-directory: backend
      - name: Public Maven OSV and npm advisory inventory
        run: python3 scripts/phase_k_dependency_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-k-release-scans
          include-hidden-files: true
          path: |
            .tmp/phase-k/source-checks.json
            .tmp/phase-k/dependencies.json
