greenocean.auth.jwt-secret=test-only-secret-with-at-least-thirty-two-bytes

spring.datasource.url=${GREENOCEAN_TEST_DB_URL}
spring.datasource.username=${GREENOCEAN_TEST_DB_USER:postgres}
spring.datasource.password=${GREENOCEAN_TEST_DB_PASSWORD:}
greenocean.phase-a.legacy-grace-until=2099-01-01T00:00:00Z

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
greenocean.verification.resend-cooldown-seconds=0

greenocean.social.publishing-enabled=true
greenocean.social.policy-approved=true

greenocean.groups.activities-enabled=true

# Synthetic isolated QA policy only. These are not approved production retention defaults.
greenocean.listener-support.processing-approved=true
greenocean.listener-support.policy-reference=synthetic-qa-only
greenocean.listener-support.retention.calendar-days=30
greenocean.listener-support.retention.booking-days=30
greenocean.listener-support.retention.queue-days=30
greenocean.listener-support.retention.feedback-days=30
greenocean.listener-support.retention.extension-days=30

greenocean.wellbeing.new-sensitive-processing=true

greenocean.education.publication-approved=true

greenocean.education.learning-enabled=true
