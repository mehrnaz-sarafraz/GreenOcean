greenocean.auth.jwt-secret=test-only-secret-with-at-least-thirty-two-bytes
spring.datasource.password=test-only-placeholder

# High limits for normal integration tests.
# Dedicated rate-limit tests will use stricter overrides.
greenocean.security.rate-limit.login-ip-max=1000
greenocean.security.rate-limit.register-ip-max=1000
greenocean.security.rate-limit.refresh-ip-max=1000
greenocean.security.rate-limit.login-failure-max=1000