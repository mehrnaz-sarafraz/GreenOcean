spring.application.name=greenocean-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/greenocean
spring.datasource.username=postgres
spring.datasource.password=${GREENOCEAN_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

greenocean.auth.jwt-secret=${GREENOCEAN_JWT_SECRET}
greenocean.auth.jwt-issuer=greenocean-backend
greenocean.auth.access-token-ttl=PT15M
greenocean.auth.refresh-token-ttl=P30D
greenocean.security.allowed-origin-patterns=${GREENOCEAN_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
greenocean.auth.email-verification-token-ttl=PT24H
greenocean.auth.password-reset-token-ttl=PT30M
greenocean.auth.require-verified-email=false
greenocean.security.rate-limit.recovery-ip-max=5
greenocean.security.rate-limit.recovery-ip-window=PT15M

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB
greenocean.media.root=${GREENOCEAN_MEDIA_ROOT:./var/media}
greenocean.media.max-bytes=${GREENOCEAN_MEDIA_MAX_BYTES:12582912}
greenocean.media.pending-ttl=PT24H

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

