spring.application.name=greenocean-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/greenocean
spring.datasource.username=postgres
spring.datasource.password=${GREENOCEAN_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

greenocean.auth.jwt-secret=${GREENOCEAN_JWT_SECRET}
greenocean.auth.jwt-issuer=greenocean-backend
greenocean.auth.access-token-ttl=PT15M
greenocean.auth.refresh-token-ttl=P30D
greenocean.security.allowed-origin-patterns=${GREENOCEAN_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
greenocean.storage.professional-documents-root=${PROFESSIONAL_DOCUMENTS_ROOT:${java.io.tmpdir}/greenocean-professional-documents}

greenocean.mail.enabled=${GREENOCEAN_MAIL_ENABLED:false}
greenocean.mail.gateway-url=${GREENOCEAN_MAIL_GATEWAY_URL:}
greenocean.mail.gateway-token=${GREENOCEAN_MAIL_GATEWAY_TOKEN:}
greenocean.mail.outbox-key=${GREENOCEAN_MAIL_OUTBOX_KEY:${greenocean.auth.jwt-secret}}
greenocean.phase-a.legacy-grace-until=${GREENOCEAN_LEGACY_GRACE_UNTIL:9999-12-31T23:59:59Z}
greenocean.security.admin-enabled=${GREENOCEAN_ADMIN_ENABLED:false}
greenocean.auth.web-cookie-secure=${GREENOCEAN_WEB_COOKIE_SECURE:true}
greenocean.auth.registration-attempts=${GREENOCEAN_REGISTRATION_ATTEMPTS:30}
greenocean.auth.registration-window-seconds=${GREENOCEAN_REGISTRATION_WINDOW_SECONDS:60}
greenocean.mail.from=${GREENOCEAN_MAIL_FROM:no-reply@greenocean.invalid}
greenocean.mail.mode=${GREENOCEAN_MAIL_MODE:development}
greenocean.mail.templates-approved=${GREENOCEAN_MAIL_TEMPLATES_APPROVED:false}
greenocean.mail.staging-recipients=${GREENOCEAN_MAIL_STAGING_RECIPIENTS:}
greenocean.mail.event-key=${GREENOCEAN_MAIL_EVENT_KEY:}
greenocean.mail.key-id=${GREENOCEAN_MAIL_KEY_ID:primary}
greenocean.mail.previous-keys=${GREENOCEAN_MAIL_PREVIOUS_KEYS:}
greenocean.mail.max-attempts=${GREENOCEAN_MAIL_MAX_ATTEMPTS:5}
greenocean.mail.batch-size=${GREENOCEAN_MAIL_BATCH_SIZE:10}
greenocean.mail.lease-seconds=${GREENOCEAN_MAIL_LEASE_SECONDS:30}
greenocean.verification.attempts=${GREENOCEAN_VERIFICATION_ATTEMPTS:5}
greenocean.verification.deliveries=${GREENOCEAN_VERIFICATION_DELIVERIES:5}
greenocean.verification.correction-attempts=${GREENOCEAN_EMAIL_CORRECTION_ATTEMPTS:3}
greenocean.verification.window=${GREENOCEAN_VERIFICATION_WINDOW:PT15M}
greenocean.verification.resend-cooldown-seconds=${GREENOCEAN_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
greenocean.pending-cleanup.enabled=${GREENOCEAN_PENDING_CLEANUP_ENABLED:false}
greenocean.pending-cleanup.dry-run=${GREENOCEAN_PENDING_CLEANUP_DRY_RUN:true}
greenocean.pending-cleanup.paused=${GREENOCEAN_PENDING_CLEANUP_PAUSED:false}
greenocean.pending-cleanup.retention=${GREENOCEAN_PENDING_RETENTION:P7D}
greenocean.pending-cleanup.batch-size=${GREENOCEAN_PENDING_CLEANUP_BATCH_SIZE:50}
greenocean.pending-cleanup.poll-ms=${GREENOCEAN_PENDING_CLEANUP_POLL_MS:3600000}

# E/F server-authoritative session policy. Forwarded headers require a separately reviewed trusted proxy.
server.forward-headers-strategy=NONE
greenocean.session.web-overall=${GREENOCEAN_SESSION_WEB_OVERALL:PT24H}
greenocean.session.web-idle=${GREENOCEAN_SESSION_WEB_IDLE:PT30M}
greenocean.session.mobile-overall=${GREENOCEAN_SESSION_MOBILE_OVERALL:P30D}
greenocean.session.mobile-idle=${GREENOCEAN_SESSION_MOBILE_IDLE:PT24H}
greenocean.session.privileged-overall=${GREENOCEAN_SESSION_PRIVILEGED_OVERALL:PT12H}
greenocean.session.privileged-idle=${GREENOCEAN_SESSION_PRIVILEGED_IDLE:PT30M}
greenocean.session.recent-auth=${GREENOCEAN_SESSION_RECENT_AUTH:PT10M}
greenocean.security.events-retention-days=${GREENOCEAN_SECURITY_EVENTS_RETENTION_DAYS:30}

greenocean.webauthn.enabled=${GREENOCEAN_WEBAUTHN_ENABLED:false}
greenocean.webauthn.rp-id=${GREENOCEAN_WEBAUTHN_RP_ID:}
greenocean.webauthn.origins=${GREENOCEAN_WEBAUTHN_ORIGINS:}

greenocean.auth.recovery-base-url=${GREENOCEAN_RECOVERY_BASE_URL:}

# Phase I: real human service stays disabled until operational, regional and policy approval.
greenocean.live-support.enabled=${GREENOCEAN_LIVE_SUPPORT_ENABLED:false}
greenocean.live-support.offer-seconds=${GREENOCEAN_LIVE_SUPPORT_OFFER_SECONDS:90}
greenocean.live-support.activation-seconds=${GREENOCEAN_LIVE_SUPPORT_ACTIVATION_SECONDS:60}
greenocean.live-support.presence-seconds=${GREENOCEAN_LIVE_SUPPORT_PRESENCE_SECONDS:45}
greenocean.live-support.reconnect-seconds=${GREENOCEAN_LIVE_SUPPORT_RECONNECT_SECONDS:120}
greenocean.live-support.heartbeat-seconds=${GREENOCEAN_LIVE_SUPPORT_HEARTBEAT_SECONDS:15}
greenocean.live-support.sweep-ms=${GREENOCEAN_LIVE_SUPPORT_SWEEP_MS:10000}

# Phase L: enable only after approved policy and actual moderation operations.
greenocean.social.publishing-enabled=${GREENOCEAN_SOCIAL_PUBLISHING_ENABLED:false}
greenocean.social.policy-approved=${GREENOCEAN_SOCIAL_POLICY_APPROVED:false}

# Phase M activities require actual review capacity and approved processing.
greenocean.groups.activities-enabled=${GREENOCEAN_GROUP_ACTIVITIES_ENABLED:false}

# Phase N: independent default-off gates; production purpose/retention and staffing approval required.
greenocean.listener-support.scheduling-enabled=${GREENOCEAN_LISTENER_SCHEDULING_ENABLED:false}
greenocean.listener-support.booking-enabled=${GREENOCEAN_LISTENER_BOOKING_ENABLED:false}
greenocean.listener-support.queue-enabled=${GREENOCEAN_LISTENER_QUEUE_ENABLED:false}
greenocean.listener-support.followup-enabled=${GREENOCEAN_LISTENER_FOLLOWUP_ENABLED:false}
greenocean.listener-support.duration-enabled=${GREENOCEAN_LISTENER_DURATION_ENABLED:false}

greenocean.listener-support.extension-enabled=${GREENOCEAN_LISTENER_EXTENSION_ENABLED:false}

# Populate only from an actually approved purpose and category-retention policy.
greenocean.listener-support.processing-approved=${GREENOCEAN_LISTENER_PROCESSING_APPROVED:false}
greenocean.listener-support.policy-reference=${GREENOCEAN_LISTENER_POLICY_REFERENCE:phase-n-retention-owner-2026-10-28}
greenocean.listener-support.purge-enabled=${GREENOCEAN_LISTENER_PURGE_ENABLED:false}
greenocean.listener-support.retention.calendar-days=${GREENOCEAN_LISTENER_CALENDAR_RETENTION_DAYS:30}
greenocean.listener-support.retention.booking-days=${GREENOCEAN_LISTENER_BOOKING_RETENTION_DAYS:30}
greenocean.listener-support.retention.queue-days=${GREENOCEAN_LISTENER_QUEUE_RETENTION_DAYS:30}
greenocean.listener-support.retention.feedback-days=${GREENOCEAN_LISTENER_FEEDBACK_RETENTION_DAYS:30}
greenocean.listener-support.retention.extension-days=${GREENOCEAN_LISTENER_EXTENSION_RETENTION_DAYS:30}

# Phase O private daily answers/drafts require separate production processing approval.
greenocean.wellbeing.new-sensitive-processing=${GREENOCEAN_WELLBEING_SENSITIVE_PROCESSING:false}

greenocean.education.publication-approved=${GREENOCEAN_EDUCATION_PUBLICATION_APPROVED:false}
