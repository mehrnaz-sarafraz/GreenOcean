spring.application.name=greenocean-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/greenocean
spring.datasource.username=postgres
spring.datasource.password=${GREENOCEAN_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

greenocean.auth.jwt-secret=${GREENOCEAN_JWT_SECRET}
greenocean.auth.jwt-issuer=greenocean-backend
greenocean.auth.access-token-ttl=PT15M
greenocean.auth.refresh-token-ttl=P30D
greenocean.security.allowed-origin-patterns=${GREENOCEAN_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
greenocean.storage.professional-documents-root=${PROFESSIONAL_DOCUMENTS_ROOT:${java.io.tmpdir}/greenocean-professional-documents}
